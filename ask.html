<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask About Ify</title>
<style>
  :root{
    --bg:#F5F3FA; --card:#FFFFFF; --ink:#161221; --sub:#6B6478;
    --accent:#6D28D9; --ring:#E7E2F5; --bot:#F0EDFA;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15121F; --card:#1F1B2E; --ink:#F2EFFA; --sub:#A79FC2; --ring:#332C4A; --bot:#2A2440;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15121F; --card:#1F1B2E; --ink:#F2EFFA; --sub:#A79FC2; --ring:#332C4A; --bot:#2A2440;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; justify-content:center; padding:20px;
    padding-top:calc(20px + env(safe-area-inset-top,0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  }
  .wrap{ width:100%; max-width:480px; display:flex; flex-direction:column; height:min(640px, 92vh); }
  header{ text-align:center; margin-bottom:14px; }
  h1{ margin:0 0 4px; font-size:24px; letter-spacing:-0.02em; }
  h1 span{ color:var(--accent); }
  .sub{ margin:0; color:var(--sub); font-size:13.5px; }
  .chat{
    flex:1; overflow-y:auto; background:var(--card); border:1px solid var(--ring);
    border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px;
  }
  .msg{ max-width:82%; padding:10px 14px; border-radius:14px; font-size:14.5px; line-height:1.45; }
  .msg.bot{ background:var(--bot); align-self:flex-start; border-bottom-left-radius:4px; }
  .msg.user{ background:var(--accent); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .chip{
    background:var(--card); border:1px solid var(--ring); color:var(--ink);
    border-radius:999px; padding:7px 12px; font-size:12.5px; cursor:pointer;
  }
  .chip:hover{ border-color:var(--accent); }
  .inputRow{ display:flex; gap:8px; }
  #input{
    flex:1; border:1px solid var(--ring); border-radius:12px; padding:12px 14px;
    font-size:15px; background:var(--card); color:var(--ink);
  }
  #input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  button[type="submit"]{
    background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:0 18px; font-weight:600; cursor:pointer;
  }
  .note{ text-align:center; color:var(--sub); font-size:11.5px; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ask about <span>Ify</span></h1>
    <p class="sub">A scripted assistant — not a live model — that knows Egbuta Ifeanyi Chukwu's profile.</p>
  </header>
  <div class="chat" id="chat">
    <div class="msg bot">Hey 👋 Ask me about Ify's skills, projects, StackIt, or how to reach him.</div>
  </div>
  <div class="chips" id="chips">
    <button class="chip" type="button">What do you do?</button>
    <button class="chip" type="button">Tell me about StackIt</button>
    <button class="chip" type="button">Are you open to work?</button>
    <button class="chip" type="button">How do I contact you?</button>
  </div>
  <form id="form" class="inputRow">
    <input id="input" type="text" placeholder="Ask something…" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
  <p class="note">Scripted answers only — no data sent anywhere, no API keys involved.</p>
</div>

<script>
  const KB = [
    { kws:["who","about","introduce","yourself","bio","egbuta","ifeanyi"], a:"I'm Egbuta Ifeanyi Chukwu — a Full-Stack Developer and AI Engineer based in Lagos, Nigeria. I build scalable web and mobile apps with React, JavaScript, Node.js, APIs, and PostgreSQL, and I lean on AI tools heavily in my day-to-day workflow." },
    { kws:["skill","stack","tech","technology","frontend","backend","react","node","postgres","typescript","javascript","language","do you do"], a:"Frontend: React, JavaScript, TypeScript, HTML5, CSS3. Backend: Node.js, PostgreSQL, REST APIs. I work across the whole stack, end to end." },
    { kws:["ai tool","claude","cursor","copilot","gemini","perplexity","windsurf","v0","meta muse","google flow","ai engineer"], a:"I'm an intermediate user of Claude, Cursor, Google Flow, Meta Muse, GitHub Copilot, Perplexity, Windsurf, Gemini, and v0 — I use them daily to speed up development." },
    { kws:["stackit","fintech","savings","founder"], a:"I'm the Founder of StackIt, a mobile social savings fintech platform. I led it from concept to implementation — architecture, backend, API integrations, database design, and the mobile app itself." },
    { kws:["project","portfolio","built","sanity","lenslink","github"], a:"One I can point to publicly: Sanity LensLink Agent, an AI camera-gear compatibility agent powered by Sanity structured content. I've got more in progress that aren't public yet." },
    { kws:["hire","job","freelance","available","open","contract","collaborate"], a:"Yes — I'm open to freelance/contract work, collaborations, and full-time roles. Best way in is WhatsApp or LinkedIn, both on my GitHub profile." },
    { kws:["contact","reach","whatsapp","phone","number","email","linkedin","call","talk"], a:"WhatsApp/Call: +234 701 401 0018. LinkedIn is also linked on my GitHub profile — reach out any time." },
    { kws:["where","location","based","lagos","nigeria","live"], a:"Based in Lagos, Nigeria." },
    { kws:["game","dodge","no button"], a:"You found the other one too — the \"Would You Hire Me?\" game where No runs from your cursor. This bot is the polite version." },
    { kws:["hello","hi","hey","sup","yo","morning","evening"], a:"Hey! Ask me anything about Ify — skills, projects, StackIt, or how to reach him." }
  ];

  function respond(text){
    const q = text.toLowerCase();
    let best = null, bestScore = 0;
    for(const entry of KB){
      let score = 0;
      for(const k of entry.kws){ if(q.includes(k)) score++; }
      if(score > bestScore){ bestScore = score; best = entry; }
    }
    if(best) return best.a;
    return "I don't have a scripted answer for that one — try asking about skills, StackIt, projects, or how to reach him, or just message him directly on WhatsApp.";
  }

  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');

  function addMsg(text, who){
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  function ask(text){
    if(!text.trim()) return;
    addMsg(text, 'user');
    input.value = '';
    setTimeout(() => addMsg(respond(text), 'bot'), 380);
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); ask(input.value); });
  document.getElementById('chips').addEventListener('click', (e) => {
    if(e.target.classList.contains('chip')) ask(e.target.textContent);
  });
</script>
</body>
</html>
